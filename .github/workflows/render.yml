name: Ofoq Render

on:
  workflow_dispatch:
    inputs:
      scene_file:
        description: 'اختر المشهد اللي عاوز ترندره'
        required: false
        default: 'scene.html'
        type: choice
        options:
          - scene.html
          - scene-ayat-alkursi.html

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome + Playwright deps
        run: npx playwright install --with-deps chrome

      - name: Render video
        env:
          OFOQ_SCENE_FILE: ${{ github.event.inputs.scene_file || 'scene.html' }}
        run: npm run render

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofoq-render-output
          path: output/*.mp4

      - name: Create GitHub Release with the video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ github.run_number }}
          name: "Ofoq Render #${{ github.run_number }} (${{ github.event.inputs.scene_file || 'scene.html' }})"
          files: output/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
