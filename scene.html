<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آية الكرسي — Short — Ofoq / Mediabunny</title>

    <!-- خط IBM Plex Sans Arabic محمّل كـ Web Font مباشرة من جوه الملف — بدون أي تثبيت على السيرفر -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body, html {
            width: 100%; height: 100%;
            background-color: #050505; color: #f2f2f2;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-family: system-ui, -apple-system, sans-serif;
        }
        #render-viewport {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        canvas {
            max-width: 90%; max-height: 90%;
            aspect-ratio: 9 / 16; object-fit: contain;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.15);
            border-radius: 12px; border: 1px solid #1a1a1a;
        }
        #render-overlay {
            position: absolute; top: 24px; right: 24px;
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid #333;
            padding: 12px 24px; border-radius: 999px;
            display: flex; align-items: center; gap: 12px; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 18px; height: 18px; flex-shrink: 0;
            border: 2px solid #d4af37; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-text { font-size: 14px; color: #f3e5ab; font-weight: 600; }
    </style>
</head>
<body>

    <div id="render-viewport">
        <canvas id="xCanvas" width="1080" height="1920"></canvas>
        <div id="render-overlay">
            <div class="spinner" id="spinner"></div>
            <span id="status-text">جاري بدء التشغيل...</span>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "mediabunny": "https://esm.sh/mediabunny@1.50.8"
        }
    }
    </script>

    <script type="module">
        import {
            Output,
            Mp4OutputFormat,
            BufferTarget,
            CanvasSource,
            AudioBufferSource,
            QUALITY_HIGH,
            canEncodeAudio
        } from 'mediabunny';

        import { registerAacEncoder } from 'https://esm.sh/@mediabunny/aac-encoder?external=mediabunny';
        if (!(await canEncodeAudio('aac'))) {
            registerAacEncoder();
        }

        const SURAH_NUMBER = 2;
        const AYAH_NUMBER = 255;
        const SURAH_NAME = 'آية الكرسي';
        const RECITER = 'Alafasy_128kbps';
        const FONT_FAMILY = 'IBM Plex Sans Arabic';
        const FPS = 30;
        const W = 1080, H = 1920; // فيديو رأسي (Short)
        const OUTPUT_FILENAME = 'Ayat-Al-Kursi-Short.mp4';

        const canvas = document.getElementById('xCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        window.__ofoqStatus = 'pending';

        function pad3(n){ return String(n).padStart(3, '0'); }

        async function fetchAyahText(surah, ayah) {
            const url = `https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/quran-uthmani`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('fetch failed');
                const data = await res.json();
                return `﴿ ${data.data.text} ﴾`;
            } catch (e) {
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                const res = await fetch(proxyUrl);
                const data = await res.json();
                return `﴿ ${data.data.text} ﴾`;
            }
        }

        async function fetchAyahAudioBuffer(surah, ayah, audioContext) {
            const url = `https://everyayah.com/data/${RECITER}/${pad3(surah)}${pad3(ayah)}.mp3`;
            let arrayBuf;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('fetch failed');
                arrayBuf = await res.arrayBuffer();
            } catch (e) {
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                const res = await fetch(proxyUrl);
                arrayBuf = await res.arrayBuffer();
            }
            return audioContext.decodeAudioData(arrayBuf);
        }

        // شروق فوق جبال: سماء متدرجة دافئة + شمس + طبقات جبال — SVG مرسوم داخل الملف
        function buildBackgroundSvg(w, h) {
            return `
            <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
                <defs>
                    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#0f1f38"/>
                        <stop offset="42%" stop-color="#3c4a72"/>
                        <stop offset="72%" stop-color="#d98a5f"/>
                        <stop offset="100%" stop-color="#f4c07a"/>
                    </linearGradient>
                    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#25324f"/>
                        <stop offset="100%" stop-color="#141b2c"/>
                    </linearGradient>
                    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#141b2c"/>
                        <stop offset="100%" stop-color="#0a0e18"/>
                    </linearGradient>
                </defs>
                <rect width="${w}" height="${h}" fill="url(#sky2)"/>
                <circle cx="${w*0.5}" cy="${h*0.47}" r="${w*0.13}" fill="#ffdca0" opacity="0.9"/>
                <path d="M0,${h*0.60} L${w*0.17},${h*0.50} L${w*0.34},${h*0.575} L${w*0.5},${h*0.46} L${w*0.67},${h*0.565} L${w*0.83},${h*0.50} L${w},${h*0.585} L${w},${h} L0,${h} Z" fill="url(#mtn2)"/>
                <path d="M0,${h*0.68} L${w*0.20},${h*0.585} L${w*0.43},${h*0.655} L${w*0.63},${h*0.565} L${w*0.83},${h*0.635} L${w},${h*0.60} L${w},${h} L0,${h} Z" fill="url(#mtn1)"/>
            </svg>`;
        }

        function svgToImage(svgString) {
            return new Promise((resolve, reject) => {
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('فشل تحويل SVG الخلفية لصورة')); };
                img.src = url;
            });
        }

        function arrayBufferToBase64(buffer){
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize){
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function drawFrame(bgImage, ayahText, progress) {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(bgImage, 0, 0, W, H);

            const overlay = ctx.createLinearGradient(0, 0, 0, H);
            overlay.addColorStop(0, 'rgba(3,7,18,0.4)');
            overlay.addColorStop(1, 'rgba(3,7,18,0.75)');
            ctx.fillStyle = overlay;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.strokeRect(50, 90, W - 100, H - 180);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold 42px '${FONT_FAMILY}', 'Noto Naskh Arabic', sans-serif`;
            ctx.fillStyle = '#d4af37';
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = 10;
            ctx.fillText(SURAH_NAME, W / 2, 190);

            ctx.font = `500 46px '${FONT_FAMILY}', 'Noto Naskh Arabic', sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 14;
            wrapAndDrawText(ayahText, W / 2, H / 2, W - 160, 66);
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(212,175,55,0.25)';
            ctx.fillRect(120, H - 150, W - 240, 6);
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(120, H - 150, (W - 240) * progress, 6);
        }

        function wrapAndDrawText(text, centerX, centerY, maxWidth, lineHeight) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            for (const word of words) {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                if (ctx.measureText(testLine).width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);

            const startY = centerY - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, i) => {
                ctx.fillText(line, centerX, startY + i * lineHeight);
            });
        }

        const yieldThread = () => new Promise(r => setTimeout(r, 0));

        async function startPipeline() {
            try {
                if (window.location.protocol === 'file:') {
                    throw new Error('لازم تفتح الملف عبر سيرفر محلي (http)، مش بفتحه المباشر (file://)');
                }

                statusText.innerText = `جاري تحميل خط ${FONT_FAMILY}...`;
                try { await document.fonts.load(`500 46px '${FONT_FAMILY}'`); } catch(e) {}
                try { await document.fonts.ready; } catch(e) {}

                statusText.innerText = 'جاري رسم خلفية المنظر الطبيعي...';
                const bgImage = await svgToImage(buildBackgroundSvg(W, H));

                statusText.innerText = 'جاري جلب آية الكرسي...';
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                const [ayahText, audioBuffer] = await Promise.all([
                    fetchAyahText(SURAH_NUMBER, AYAH_NUMBER),
                    fetchAyahAudioBuffer(SURAH_NUMBER, AYAH_NUMBER, audioContext),
                ]);

                const totalDuration = audioBuffer.duration;
                const totalFrames = Math.ceil(totalDuration * FPS);

                statusText.innerText = 'جاري تحضير محرك Mediabunny...';

                const output = new Output({
                    format: new Mp4OutputFormat(),
                    target: new BufferTarget()
                });

                const videoSource = new CanvasSource(canvas, {
                    codec: 'avc',
                    bitrate: QUALITY_HIGH
                });
                output.addVideoTrack(videoSource);

                const audioSource = new AudioBufferSource({
                    codec: 'aac',
                    bitrate: QUALITY_HIGH
                });
                output.addAudioTrack(audioSource);

                await output.start();
                await audioSource.add(audioBuffer);

                statusText.innerText = `جاري رندر الفريمات (${totalFrames} فريم)...`;

                for (let i = 0; i < totalFrames; i++) {
                    const t = i / FPS;
                    const progress = i / totalFrames;

                    drawFrame(bgImage, ayahText, progress);
                    await videoSource.add(t, 1 / FPS);

                    if (i % 20 === 0) {
                        statusText.innerText = `رندر وتشفير: ${Math.round(progress * 100)}%`;
                        await yieldThread();
                    }
                }

                statusText.innerText = 'جاري تجميع وحفظ الملف النهائي...';
                await output.finalize();

                const finalBuffer = output.target.buffer;
                const blob = new Blob([finalBuffer], { type: 'video/mp4' });
                const downloadUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = OUTPUT_FILENAME;
                a.click();

                window.__ofoqFilename = OUTPUT_FILENAME;
                window.__ofoqBase64 = arrayBufferToBase64(finalBuffer);
                window.__ofoqStatus = 'done';

                spinner.style.display = 'none';
                statusText.innerText = 'تم إنتاج فيديو آية الكرسي بنجاح بفضل الله! 🎉';

            } catch (err) {
                console.error('Mediabunny Error:', err);
                window.__ofoqStatus = 'error';
                window.__ofoqError = err.message;
                spinner.style.display = 'none';
                statusText.style.color = '#ef4444';
                statusText.innerText = 'خطأ: ' + err.message;
            }
        }

        window.addEventListener('load', () => setTimeout(startPipeline, 500));
    </script>
</body>
</html>
